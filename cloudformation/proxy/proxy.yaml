AWSTemplateFormatVersion: 2010-09-09
Description: AWS ParallelCluster Proxy Environment

Parameters:
  Keypair:
    Description: EC2 Keypair to access management instance.
    Type: AWS::EC2::KeyPair::KeyName

  InstanceType:
    Description: Instance type of the proxy and client instances.
    Type: String
    Default: t3.medium

  VpcCidr:
    Description: CIDR for the VPC
    Type: String
    Default: 10.0.0.0/16

  SSHCidr:
    Description: CIDR to allow SSH traffic from
    Type: String
    Default: 0.0.0.0/0

  EnableBuildImageProxy:
    Description: >-
      When true, enables build-image isolated network mode: adds VPC endpoints,
      IP forwarding, tinyproxy domain allowlist, and removes ProxyClient verification.
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Networking
        Parameters:
          - VpcCidr
          - SSHCidr
      - Label:
          default: Permissions
        Parameters:
          - Keypair
      - Label:
          default: Build Image Proxy
        Parameters:
          - EnableBuildImageProxy
  cfn-lint:
    config:
      ignore_checks:
        - E1152

Conditions:
  IsBuildImageProxy: !Equals [!Ref EnableBuildImageProxy, "true"]
  IsClusterProxy: !Not [!Condition IsBuildImageProxy]
  # China regions (aws-cn partition) use cn.com.amazonaws prefix for VPC Interface endpoint service names
  IsChinaRegion: !Equals [!Ref "AWS::Partition", "aws-cn"]

Resources:

  # VPC
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: ProxyVPC

  # INTERNET GATEWAY
  VpcIGW:
    Type: AWS::EC2::InternetGateway

  VpcGWA:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref VpcIGW
      VpcId: !Ref Vpc

  # PUBLIC SUBNET
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub ${AWS::Region}a
      CidrBlock: !Select [ 0, !Cidr [ !GetAtt Vpc.CidrBlock, 2, 8 ]]
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: ProxyVPC/Public

  PublicSubnetRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicSubnetRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicSubnetRT
      SubnetId: !Ref PublicSubnet

  PublicSubnetRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - VpcGWA
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VpcIGW
      RouteTableId: !Ref PublicSubnetRT

  # PRIVATE SUBNET
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Sub ${AWS::Region}b
      CidrBlock: !Select [ 1, !Cidr [ !GetAtt Vpc.CidrBlock, 2, 8 ]]
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: ProxyVPC/Private

  PrivateSubnetRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateSubnetRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateSubnetRT
      SubnetId: !Ref PrivateSubnet

  PrivateSubnetRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - Proxy
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref Proxy
      RouteTableId: !Ref PrivateSubnetRT

  # VPC ENDPOINTS (build-image mode only)
  # S3 Gateway endpoint uses standard com.amazonaws naming in all partitions
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsBuildImageProxy
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      VpcId: !Ref Vpc
      RouteTableIds:
        - !Ref PrivateSubnetRT

  # Interface endpoints use com.amazonaws in all partitions, except for some services in China regions
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsBuildImageProxy
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      VpcId: !Ref Vpc
      SubnetIds:
        - !Ref PrivateSubnet

  # EC2 VPC endpoint uses cn.com.amazonaws prefix in China regions
  EC2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsBuildImageProxy
    Properties:
      ServiceName: !Sub
        - "${Prefix}.${AWS::Region}.ec2"
        - Prefix: !If [IsChinaRegion, "cn.com.amazonaws", "com.amazonaws"]
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      VpcId: !Ref Vpc
      SubnetIds:
        - !Ref PrivateSubnet

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsBuildImageProxy
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      VpcId: !Ref Vpc
      SubnetIds:
        - !Ref PrivateSubnet

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsBuildImageProxy
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      VpcId: !Ref Vpc
      SubnetIds:
        - !Ref PrivateSubnet

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsBuildImageProxy
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      VpcId: !Ref Vpc
      SubnetIds:
        - !Ref PrivateSubnet

  # ImageBuilder VPC endpoint uses cn.com.amazonaws prefix in China regions
  ImageBuilderEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsBuildImageProxy
    Properties:
      ServiceName: !Sub
        - "${Prefix}.${AWS::Region}.imagebuilder"
        - Prefix: !If [IsChinaRegion, "cn.com.amazonaws", "com.amazonaws"]
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      VpcId: !Ref Vpc
      SubnetIds:
        - !Ref PrivateSubnet

  # SECURITY GROUPS
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for the proxy node
      SecurityGroupIngress:
        - CidrIp: !GetAtt PrivateSubnet.CidrBlock
          Description: Allow all inbound traffic from private subnet
          IpProtocol: -1
        - CidrIp: !Ref SSHCidr
          Description: Allow SSH access from specified CIDR
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
          IpProtocol: -1
      VpcId: !Ref Vpc

  ProxyClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsClusterProxy
    Properties:
      GroupDescription: Security Group for proxy clients
      SecurityGroupIngress:
        - CidrIp: !Sub [ "${ProxyPrivateIp}/32", {ProxyPrivateIp: !GetAtt Proxy.PrivateIp}]
          Description: Allow all inbound traffic from proxy
          IpProtocol: -1
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
          IpProtocol: -1
      VpcId: !Ref Vpc

  # IAM PERMISSIONS
  ProxyInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ProxyRole

  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  ProxyClientNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ProxyClientNodeRole

  ProxyClientNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
        Version: 2012-10-17
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  Imdsv2LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 4
          HttpTokens: required

  # PROXY INSTANCE
  Proxy:
    Type: AWS::EC2::Instance
    DependsOn:
      - VpcIGW
      - ProxyENI
    Properties:
      IamInstanceProfile: !Ref ProxyInstanceProfile
      ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
      InstanceType: !Ref InstanceType
      KeyName: !Ref Keypair
      NetworkInterfaces:
        - DeviceIndex: 0
          NetworkInterfaceId: !Ref ProxyENI
      LaunchTemplate:
        LaunchTemplateId: !Ref Imdsv2LaunchTemplate
        Version: !GetAtt Imdsv2LaunchTemplate.LatestVersionNumber
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash -ex
            set -o pipefail
            exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

            BUILD_IMAGE_PROXY="${EnableBuildImageProxy}"

            # apt's built-in retry for transient fetch failures (e.g., Ubuntu mirror sync glitches).
            APT_RETRY="-o Acquire::Retries=5"

            # Enable IP forwarding — without this, the kernel drops packets routed from
            # the private subnet, causing "connection timed out" in the ConfigureSystem step.
            if [ "$BUILD_IMAGE_PROXY" = "true" ]; then
              sysctl -w net.ipv4.ip_forward=1
              echo "net.ipv4.ip_forward = 1" >> /etc/sysctl.conf
            fi

            apt-get $APT_RETRY update -y
            apt-get $APT_RETRY install -y tinyproxy redsocks

            # Tinyproxy config — build-image mode adds domain allowlist filtering
            cat << EOF > /etc/tinyproxy/tinyproxy.conf
            User tinyproxy
            Group tinyproxy
            Port 8888
            Timeout 3600
            DefaultErrorFile "/usr/share/tinyproxy/default.html"
            StatFile "/usr/share/tinyproxy/stats.html"
            Logfile "/var/log/tinyproxy/tinyproxy.log"
            LogLevel Info
            PidFile "/run/tinyproxy/tinyproxy.pid"
            MaxClients 500
            MinSpareServers 20
            MaxSpareServers 100
            StartServers 20
            MaxRequestsPerChild 0
            ViaProxyName "tinyproxy"
            ConnectPort 443
            ConnectPort 563
            EOF

            if [ "$BUILD_IMAGE_PROXY" = "true" ]; then
              # Add domain allowlist filtering for isolated network
              echo 'Filter "/etc/tinyproxy/filter"' >> /etc/tinyproxy/tinyproxy.conf
              echo 'FilterDefaultDeny Yes' >> /etc/tinyproxy/tinyproxy.conf

              # Domain allowlist for isolated network:
              # OS package repos: Ubuntu, Rocky, Amazon Linux
              # AWS services: awscli, EFA installer, S3 (global + virtual-hosted)
              # Build dependencies: Rust crates (efs-utils), snap store (Firefox/DCV on Ubuntu)
              # RHEL repos: Red Hat Update Infrastructure (RHUI)
              # EPEL GPG key: CloudFront distribution
              # DCV GPG key: CloudFront distribution (NICE DCV)
              # Rocky mirrors: domains from China mirrorlist resolution
              cat << FILTER > /etc/tinyproxy/filter
            \.ubuntu\.com$
            \.launchpadcontent\.net$
            \.fedoraproject\.org$
            ^dl\.rockylinux\.org$
            ^mirrors\.rockylinux\.org$
            ^download\.rockylinux\.org$
            ^mirror\.ps\.kz$
            \.production\.gcp\.mirrors\.ctrliq\.cloud$
            ^mirror\.hashy0917\.net$
            ^rocky\.mirror\.co\.ge$
            ^in\.mirrors\.cicku\.me$
            ^mirrors\.ipserverone\.com$
            ^mirror\.bharatdatacenter\.com$
            ^mirrors\.esto\.network$
            ^ftp\.iij\.ad\.jp$
            ^mirror\.dc\.uz$
            ^mirror\.ourhost\.az$
            ^mirror\.maeen\.sa$
            ^mirror\.nevacloud\.com$
            ^ftp\.yz\.yamagata-u\.ac\.jp$
            ^mirror\.twds\.com\.tw$
            ^cdn\.amazonlinux\.com$
            ^awscli\.amazonaws\.com
            \.s3\.amazonaws\.com
            ^s3\.amazonaws\.com
            ^efa-installer\.amazonaws\.com
            ^index\.crates\.io
            ^static\.crates\.io
            ^api\.snapcraft\.io
            ^cloudfront\.cdn\.snapcraftcontent\.com
            ^d2lzkl7pfhq30w\.cloudfront\.net
            ^d1uj6qtbmh3dt5\.cloudfront\.net
            \.aws\.ce\.redhat\.com
            FILTER
            fi

            /etc/init.d/tinyproxy restart

            # Redsocks bridges transparent HTTPS to tinyproxy via HTTP CONNECT.
            # Tinyproxy can't handle raw TLS — redsocks wraps port 443 traffic in CONNECT
            # so tinyproxy can read the hostname and apply its domain allowlist.
            # Needed for pre-Chef HTTPS calls in parallelcluster.yaml (e.g., apt-get upgrade
            # ca-certificates in the InstallCincAndCookbooks step). Once Chef runs,
            # detect_proxy.rb sets explicit proxy env vars and bypasses redsocks.
            cat << EOF > /etc/redsocks.conf
            base {
              log_debug = off;
              log_info = on;
              log = "file:/var/log/redsocks";
              daemon = on;
              user = redsocks;
              group = redsocks;
              redirector = iptables;
            }

            redsocks {
              local_ip = 0.0.0.0;
              local_port = 8889;
              ip = localhost;
              port = 8888;
              type = http-connect;
            }
            EOF

            /etc/init.d/redsocks restart

            # HTTP → tinyproxy (reads Host header for filtering)
            iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8888

            # HTTPS → redsocks → tinyproxy CONNECT (wraps TLS in CONNECT for filtering)
            iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-port 8889

            mkdir -p /etc/iptables/
            iptables-save > /etc/iptables/rules.v4

            echo iptables-persistent iptables-persistent/autosave_v4 boolean true | sudo debconf-set-selections
            echo iptables-persistent iptables-persistent/autosave_v6 boolean true | sudo debconf-set-selections
            apt-get $APT_RETRY install -y iptables-persistent
      Tags:
        - Key: Name
          Value: !Sub [ "Proxy-${StackIdSuffix}", {StackIdSuffix: !Select [1, !Split ['/', !Ref 'AWS::StackId']]}]

  ProxyENI:
    Type: AWS::EC2::NetworkInterface
    Properties:
      GroupSet:
        - !Ref ProxySecurityGroup
      SourceDestCheck: false
      SubnetId: !Ref PublicSubnet

  # PROXY VERIFICATION CLIENT
  # In cluster mode: tests explicit proxy (http_proxy env var) by downloading from GitHub.
  # In build-image mode: tests transparent proxy (iptables REDIRECT) by curling allowlisted domains.
  ProxyClient:
    Type: AWS::EC2::Instance
    DependsOn:
      - Proxy
    Properties:
      IamInstanceProfile: !Ref ProxyClientNodeInstanceProfile
      ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
      InstanceType: !Ref InstanceType
      KeyName: !Ref Keypair
      SecurityGroupIds:
        - !If [IsClusterProxy, !Ref ProxyClientSecurityGroup, !GetAtt Vpc.DefaultSecurityGroup]
      SubnetId: !Ref PrivateSubnet
      LaunchTemplate:
        LaunchTemplateId: !Ref Imdsv2LaunchTemplate
        Version: !GetAtt Imdsv2LaunchTemplate.LatestVersionNumber
      UserData:
        Fn::Base64:
          !Sub
          - |
            #!/bin/bash -ex
            set -o pipefail
            exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
            BUILD_IMAGE_PROXY="${EnableBuildImageProxy}"

            # apt's built-in retry for transient fetch failures (e.g., Ubuntu mirror sync glitches).
            APT_RETRY="-o Acquire::Retries=5"

            apt-get $APT_RETRY update -y
            apt-get $APT_RETRY -y install python3-pip

            if [ "$BUILD_IMAGE_PROXY" = "true" ]; then
              echo "==> Testing HTTPS proxy (same as build instance uses via https_proxy env var)"
              https_proxy="http://${ProxyPrivateIp}:${ProxyPort}" curl -v -o /dev/null https://api.snapcraft.io/v2/snaps/info/core 2>&1 || exit 1
              echo "==> HTTPS transparent proxy test passed"
              echo "==> Signaling success via curl"
              curl -X PUT -H "Content-Type:" \
                --data-binary '{"Status":"SUCCESS","Reason":"Proxy verification passed","UniqueId":"ProxyClient","Data":"OK"}' \
                "${ProxyVerificationWaitConditionHandle}"
            else
              echo "==> Installing cfn-bootstrap"
              pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
              echo "==> Testing explicit proxy"
              echo "http_proxy=\"http://${ProxyPrivateIp}:${ProxyPort}\" wget https://github.com/aws/aws-parallelcluster/archive/refs/heads/develop.zip" > /home/ubuntu/test-proxy.sh
              echo "wget https://github.com/aws/aws-parallelcluster/archive/refs/heads/develop.zip" >> /home/ubuntu/test-proxy.sh
              chmod +x /home/ubuntu/test-proxy.sh
              bash -ex /home/ubuntu/test-proxy.sh
              echo "==> Explicit proxy test passed"

              /usr/local/bin/cfn-signal --exit-code 0 --stack "${AWS::StackName}" --region "${AWS::Region}" "${ProxyVerificationWaitConditionHandle}"
            fi

          - {
              ProxyPrivateIp: !GetAtt Proxy.PrivateIp,
              ProxyPort: 8888,
              ProxyVerificationWaitConditionHandle: !Ref ProxyVerificationWaitConditionHandle
            }
      Tags:
        - Key: Name
          Value: !Sub [ "ProxyClient-${StackIdSuffix}", { StackIdSuffix: !Select [ 1, !Split [ '/', !Ref 'AWS::StackId' ] ] } ]

  ProxyVerificationWaitConditionHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  ProxyVerificationWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Count: 1
      Handle: !Ref ProxyVerificationWaitConditionHandle
      Timeout: 600


Outputs:
  VpcId:
    Value: !Ref Vpc
  PublicSubnet:
    Value: !Ref PublicSubnet
  PrivateSubnet:
    Value: !Ref PrivateSubnet
  ProxyAddress:
    Value: !Sub [ "http://${ProxyPrivateIp}:8888", { ProxyPrivateIp: !GetAtt Proxy.PrivateIp } ]
  ProxyClientSecurityGroup:
    Condition: IsClusterProxy
    Value: !Ref ProxyClientSecurityGroup
  DefaultSecurityGroupId:
    Condition: IsBuildImageProxy
    Value: !GetAtt Vpc.DefaultSecurityGroup
