Image:
  Os: alinux2023
HeadNode:
  InstanceType: t3.micro
  Networking:
    SubnetId: subnet-12345678
  Ssh:
    KeyName: ec2-key-name
Scheduling:
  Scheduler: slurm
  SlurmQueues:
    - Name: queue1
      Networking:
        SubnetIds:
          - subnet-12345678
      ComputeResources:
        - Name: compute_resource1
          InstanceType: c5.2xlarge
SharedStorage:
  - MountDir: /ebs1
    Name: ebs1
    StorageType: Ebs
  - MountDir: /ebs2
    Name: ebs2
    StorageType: Ebs
    MountDirPermissions:
      Permissions: "0755"
  - MountDir: /efs1
    Name: efs1
    StorageType: Efs
    MountDirPermissions:
      SetPermissions: false
  - MountDir: /efs2
    Name: efs2
    StorageType: Efs
    MountDirPermissions:
      SetPermissions: true
  - MountDir: /fsx1
    Name: fsx1
    StorageType: FsxLustre
    MountDirPermissions:
      SetPermissions: false
  - MountDir: /raid
    Name: raid
    StorageType: Ebs
    EbsSettings:
      Raid:
        Type: 0
    MountDirPermissions:
      Permissions: "0750"
