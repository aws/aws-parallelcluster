{%- import 'common.jinja2' as common with context -%}
# Run by the release flow after the AMIs and the S3/ECR artifacts are published, and before the CLI is pushed to PyPI.
# Features are already covered on the same AMIs by the second stage (develop.yaml). These tests verify the published
# artifacts in the 3 partitions: the release flow passes RESOURCE_BUCKET={region}-aws-parallelcluster so that the
# tests use the released templates, policies and Lambda layer instead of uploading them from the repository.
{%- set RELEASE_REGIONS = ["ap-south-1", "cn-north-1", "us-gov-west-1"] %}
---
test-suites:
  cli_commands:
    # The CLI about to be pushed to PyPI against a cluster built from a public AMI
    test_cli_commands.py::test_slurm_cli_commands:
      dimensions:
        - regions: {{ RELEASE_REGIONS }}
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: ["rhel8"]
          schedulers: ["slurm"]
  custom_resource:
    # Released Lambda layer of the CloudFormation custom resource, cluster built from a public AMI
    test_cluster_custom_resource.py::test_cluster_create:
      dimensions:
        - regions: {{ RELEASE_REGIONS }}
          instances: {{ common.INSTANCES_DEFAULT_X86 }}
          oss: ["ubuntu2404"]
  createami:
    # Released cookbook and Cinc installer, public AMI as parent image
    test_createami.py::test_build_image_custom_components:
      dimensions:
        - regions: {{ RELEASE_REGIONS }}
          instances: {{ common.INSTANCES_DEFAULT_ARM }}
          oss: ["alinux2023"]
  pcluster_api:
    # Released API template, OpenAPI spec, policies and Lambda layer, and the API image in ECR
    test_api_infrastructure.py::test_api_infrastructure_with_default_parameters:
      dimensions:
        - regions: {{ RELEASE_REGIONS }}
