Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    ScaledownIdletime: 60
  SlurmQueues:
    - Name: queue1
      ComputeSettings:
        LocalStorage:
          RootVolume:
            Size: 45
      CapacityType: ONDEMAND
      Iam:
        AdditionalIamPolicies:
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      ComputeResources:
        - Name: queue1-cr1
          Instances:
            - InstanceType: c5.large
          MinCount: 3
          MaxCount: 5
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
    # New queue added to trigger update
    - Name: queue2
      ComputeSettings:
        LocalStorage:
          RootVolume:
            Size: 45
      CapacityType: ONDEMAND
      Iam:
        AdditionalIamPolicies:
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      ComputeResources:
        - Name: queue2-cr1
          Instances:
            - InstanceType: c5.large
          MinCount: 0
          MaxCount: 5
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
Monitoring:
  Logs:
    CloudWatch:
      Enabled: true
