Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmQueues:
    - Name: queue1
      ComputeResources:
        - Name: queue1-cr1
          Instances:
            - InstanceType: c5.large
          MinCount: {{ n_static_nodes }}
          MaxCount: {{ n_static_nodes }}
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
    # New queue added to trigger update
    - Name: queue2
      Iam:
        AdditionalIamPolicies:
          - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      ComputeResources:
        - Name: queue2-cr1
          Instances:
            - InstanceType: c5.large
          MinCount: 0
          MaxCount: 5
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
