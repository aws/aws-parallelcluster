Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: compute
      ComputeResources:
        - Name: compute-i1
          Instances:
            - InstanceType: {{ instance }}
          MinCount: {{ queue_size }}
      Networking:
        SubnetIds:
          - {{ private_subnet_ids[0] }}
          - {{ private_subnet_ids[1] }}
Monitoring:
  Logs:
    CloudWatch:
      Enabled: {{ enable }}
      RetentionInDays: {{ retention_days }}
SharedStorage:
  - MountDir: /shared
    Name: name1
    StorageType: Ebs
