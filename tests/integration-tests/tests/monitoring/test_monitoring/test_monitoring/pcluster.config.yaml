Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
  CustomActions:
    OnNodeConfigured:
      Script: {{ custom_cw_agent_script_url }}
  Iam:
    S3Access:
      - BucketName: {{ bucket_name }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue1
      Networking:
        SubnetIds:
          - {{ public_subnet_id }}
      ComputeResources:
        - Name: compute-resource1
          Instances:
            - InstanceType: {{ instance }}
          # set MinCount to 1 to ensure the existence of compute nodes
          # in order to test compute node disk and memory metrics are not gathered
          # and test detailed monitoring setting
          MinCount: 1
Monitoring:
  DetailedMonitoring: true
  Logs:
    CloudWatch:
      Enabled: {{ cw_log_enabled }}
  Dashboards:
    CloudWatch:
      Enabled: {{ dashboard_enabled }}
  Alarms:
    Enabled: {{ alarms_enabled }}
