Image:
  Os: {{ os }}
Tags:
  - Key: ComputeOverrideTag
    Value: ClusterLevelValue
  - Key: ConfigFileTag
    Value: ConfigFileTagValue
  - Key: QueueOverrideTag
    Value: ClusterLevelValue
  - Key: AdditionalConfigTag
    Value: AdditionalConfigTagValue
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-1
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          Tags:
            - Key: ComputeResourceTag
              Value: ComputeResourceValue
            - Key: ComputeOverrideTag
              Value: ComputeLevelValue
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      Tags:
        - Key: QueueTag
          Value: QueueValue
        - Key: QueueOverrideTag
          Value: QueueLevelValue
        - Key: ComputeOverrideTag
          Value: QueueLevelValue
SharedStorage:
  - MountDir: /shared
    Name: {{ volume_name }}
    StorageType: Ebs
