Image:
  Os: {{ os }}
Tags:
{% if "us-iso" in region %}
  # In ADC regions a CloudFormation bug causes HeadNodeLaunchTemplate to not be
  # updated when UpdateStack includes a Tags change together with a metadata-only
  # change on the resource, so we avoid adding a tag here (see SUPPORTED_UNLESS_ADC
  # update policy). Tags must match pcluster.config.yaml exactly to avoid a diff.
  - Key: ConfigFileTag
    Value: ConfigFileTagValue
  - Key: QueueOverrideTag
    Value: ClusterLevelValue
  - Key: ComputeOverrideTag
    Value: ClusterLevelValue
{% else %}
  - Key: ComputeOverrideTag
    Value: ClusterLevelValue
  - Key: ConfigFileTag
    Value: ConfigFileTagValue
  - Key: QueueOverrideTag
    Value: ClusterLevelValue
{% endif %}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmSettings:
    QueueUpdateStrategy: DRAIN
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-1
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          Tags:
            - Key: ComputeResourceTagUpdate
              Value: ComputeResourceValueUpdate
            - Key: ComputeOverrideTag
              Value: ComputeLevelValueUpdate
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      Tags:
        - Key: QueueTagUpdate
          Value: QueueValueUpdate
        - Key: QueueOverrideTag
          Value: QueueLevelValueUpdate
        - Key: ComputeOverrideTag
          Value: QueueLevelValueUpdate
SharedStorage:
  - MountDir: /shared
    Name: {{ volume_name }}
    StorageType: Ebs
