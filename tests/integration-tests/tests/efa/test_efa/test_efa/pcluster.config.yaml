Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ head_node_instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
    ElasticIp: true
    AdditionalSecurityGroups:
      - {{ fsx_efa_security_group_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: efa-enabled
      {% if capacity_reservation_id %}
      CapacityType: CAPACITY_BLOCK
      CapacityReservationTarget:
        CapacityReservationId: {{ capacity_reservation_id }}
      {% endif %}
      Networking:
        PlacementGroup:
          Enabled: {{ placement_group_enabled }}
          {% if placement_group_enabled and capacity_reservation_framework_placement_group %}Name: {{ capacity_reservation_framework_placement_group }}{% endif %}
        SubnetIds:
          - {{ private_subnet_id }}
        AdditionalSecurityGroups:
          - {{ fsx_efa_security_group_id }}
      ComputeResources:
        - Name: efa-enabled-i1
          InstanceType: {{ instance }}
          MaxCount: {{ max_queue_size }}
          MinCount: {{ max_queue_size }}
          DisableSimultaneousMultithreading: true
          Efa:
            Enabled: true
      {% if supports_efa_for_fsx %}
      # Unsupported instances/OSes skip the FSx EFA setup and mount the same file system over tcp.
      CustomActions:
        OnNodeStart:
          Script: s3://{{ bucket_name }}/pcluster-efa-fsx-lustre-client-tutorial.sh
      Iam:
        S3Access:
          - BucketName: {{ bucket_name }}
      {% endif %}
SharedStorage:
  - MountDir: /shared
    Name: name1
    StorageType: Ebs
  - MountDir: {{ fsx_mount_dir }}
    Name: fsx-efa
    StorageType: FsxLustre
    FsxLustreSettings:
      FileSystemId: {{ fsx_fs_id }}
