Imds:
  ImdsSupport: v2.0
Tags:
{{ tags }}
Image:
  Os: {{ os }}
LoginNodes:
  Pools:
    - Count: 1
      InstanceType:  {{ instance }}
      Name: pool
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
Scheduling:
  Scheduler: slurm
  SlurmQueues:
  - Name: queue0
    ComputeResources:
    - Name: queue0-cr0
      InstanceType: {{ instance }}
    Networking:
      SubnetIds:
      - {{ private_subnet_id }}