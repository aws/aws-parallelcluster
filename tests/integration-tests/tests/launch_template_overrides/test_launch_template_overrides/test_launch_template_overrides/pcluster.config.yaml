Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
    AdditionalSecurityGroups:
      - {{ override_security_group_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue1
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
        PlacementGroup:
          Enabled: true
          {% if capacity_reservation_framework_placement_group %}Name: {{ capacity_reservation_framework_placement_group }}{% endif %}
      ComputeResources:
        - Name: compute-resource1
          InstanceType: c5n.18xlarge
          MinCount: 1
          MaxCount: 2
          Efa:
            Enabled: false
          LaunchTemplateOverrides:
            LaunchTemplateId: {{ override_launch_template_id }}
            Version: {{ override_launch_template_version }}
