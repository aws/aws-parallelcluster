{% if "rocky" in os or "rhel" in os %}
DevSettings:
  Timeouts:
    HeadNodeBootstrapTimeout: 2040
{% endif %}
Image:
  Os: {{ os }}
HeadNode:
  # Use multi-NIC instance type from https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni.html
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
    ElasticIp: true
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  {% if scheduler == "awsbatch" %}AwsBatchQueues:{% else %}SlurmQueues:{% endif %}
    - Name: queue-0
      ComputeResources:
        # Baseline: EFA enabled, no override
        - Name: compute-resource-0
          {% if scheduler == "awsbatch" %}
          InstanceTypes:
            - {{ instance }}
          MinvCpus: 4
          {% else %}
          Instances:
            - InstanceType: {{ instance }}
            - InstanceType: c6in.metal
          MinCount: 1
          Efa:
            Enabled: true
          {% endif %}
        {% if scheduler != "awsbatch" and lt_efa_override_primary is defined %}
        # Use Case 1/2: EFA enabled, override SG on primary NIC
        - Name: cr-efa-override-primary
          InstanceType: {{ instance }}
          MinCount: 1
          Efa:
            Enabled: true
          LaunchSpecificationOverrides:
            LaunchTemplateId: {{ lt_efa_override_primary }}
            Version: "{{ lt_efa_override_primary_version }}"
        # Use Case 1/2: EFA enabled, override SG on secondary NIC
        - Name: cr-efa-override-secondary
          InstanceType: {{ instance }}
          MinCount: 1
          Efa:
            Enabled: true
          LaunchSpecificationOverrides:
            LaunchTemplateId: {{ lt_efa_override_secondary }}
            Version: "{{ lt_efa_override_secondary_version }}"
        # Use Case 3/4: EFA disabled, override InterfaceType + SG on primary NIC
        - Name: cr-no-efa-override
          InstanceType: {{ instance }}
          MinCount: 1
          Efa:
            Enabled: false
          LaunchSpecificationOverrides:
            LaunchTemplateId: {{ lt_no_efa_override }}
            Version: "{{ lt_no_efa_override_version }}"
        {% endif %}
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
        {% if scheduler != "awsbatch" %}
        PlacementGroup:
          Enabled: false
        {% endif %}
SharedStorage:
  - MountDir: /shared
    Name: name1
    StorageType: Ebs
