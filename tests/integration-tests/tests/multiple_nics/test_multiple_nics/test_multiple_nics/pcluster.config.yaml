Image:
  Os: {{ os }}
HeadNode:
  # Use multi-NIC instance type from https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni.html
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
    ElasticIp: true
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          Efa:
            Enabled: true
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
        PlacementGroup:
          Enabled: false
SharedStorage:
  - MountDir: /shared
    Name: shared-ebs
    StorageType: Ebs
  - MountDir: /shared-efs
    Name: shared-efs
    StorageType: Efs
  - MountDir: /shared-fsx-lustre
    Name: shared-fsx-lustre
    StorageType: FsxLustre
    FsxLustreSettings:
      StorageCapacity: 1200
      DeletionPolicy: Delete
DevSettings:
  EfaInterfaceType: efa
  Cookbook:
    ExtraChefAttributes: '{"cluster": {"tmp_noexec": "true"}}'