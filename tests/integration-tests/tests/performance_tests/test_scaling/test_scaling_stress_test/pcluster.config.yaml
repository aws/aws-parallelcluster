Image:
  Os: {{ os }}
HeadNode:
  {% if shared_headnode_storage_type %}
  SharedStorageType: {{ shared_headnode_storage_type }}
  {% endif %}
  InstanceType: {{ head_node_instance_type }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
Scheduling:
  Scheduler: {{ scheduler }}
  ScalingStrategy: {{ scaling_strategy }}
  SlurmSettings:
    ScaledownIdletime: {{ scaledown_idletime }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            # This queue is multi-AZ (see SubnetIds below) for capacity breadth. All-or-Nothing
            # is only enforced at the EC2 CreateFleet level (MinTargetCapacity) for
            # single-instance-type OR single-subnet queues, so the instance list depends on the
            # scaling strategy:
            #  - best-effort: no atomicity requirement, so use the flexible multi-instance-type
            #    set for better capacity diversification across pools (the realistic path). The
            #    list ({{ instance }} + equivalents) is retrieved dynamically by
            #    get_similar_instance_types via the injected flexible_instance_types variable.
            #  - all-or-nothing (and other atomic strategies): pin a single instance type so that
            #    All-or-Nothing is actually enforced by EC2 rather than silently skipped.
            # The primary instance type comes from the test config (configs/scaling_stress_test.yaml)
            # and must match the keys in results/baseline.json.
            {% if scaling_strategy == "best-effort" %}
            {% for instance_type in flexible_instance_types %}
            - InstanceType: {{ instance_type }}
            {% endfor %}
            {% else %}
            - InstanceType: {{ instance }}
            {% endif %}
          MaxCount: {{ max_cluster_size }}
      Networking:
        SubnetIds:
          {% for private_subnet_id in private_subnet_ids %}
          - {{ private_subnet_id }}
          {% endfor %}
