Build:
  InstanceType: {{ build_instance_type }}
  ParentImage: {{ parent_image }}
  SubnetId: {{ public_subnet_id }}
DevSettings:
  Cookbook:
    ExtraChefAttributes: |
      { "cluster": { "nvidia": { "enabled": "yes", "driver_version": "{{ nvidia_driver_version }}", "driver_base_url": "https://developer.download.nvidia.com/compute/nvidia-driver/{{ nvidia_driver_version }}/local_installers", "gdrcopy": { "version": "{{ gdrcopy_version }}", "base_url": "https://github.com/NVIDIA/gdrcopy/archive/refs/tags/v{{ gdrcopy_version }}.tar.gz" }, "dcgm_version": "{{ dcgm_version }}", "dcgm_base_url": "https://developer.download.nvidia.com/compute/cuda/repos", "cuda": { "version": "{{ cuda_version }}", "driver_version_suffix": "{{ cuda_release_nvidia_version }}", "base_url": "https://developer.download.nvidia.com/compute/cuda/{{ cuda_version }}/local_installers", "samples_base_url": "https://github.com/NVIDIA/cuda-samples/archive/refs/tags" } } } }
