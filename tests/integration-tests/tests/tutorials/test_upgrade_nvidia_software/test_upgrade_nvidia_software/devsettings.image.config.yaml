Build:
  InstanceType: {{ build_instance_type }}
  ParentImage: {{ parent_image }}
  Installation:
    NvidiaSoftware:
      Enabled: true
DevSettings:
  Cookbook:
    ExtraChefAttributes: |
      { "cluster": { "nvidia": { "enabled": "yes", "driver_version": "{{ nvidia_driver_version }}", "driver_base_url": "https://developer.download.nvidia.com/compute/nvidia-driver/{{ nvidia_driver_version }}/local_installers", "cuda": { "version": "{{ cuda_version }}", "driver_version_suffix": "{{ cuda_release_nvidia_version }}", "base_url": "https://developer.download.nvidia.com/compute/cuda/{{ cuda_version }}/local_installers", "samples_base_url": "https://github.com/NVIDIA/cuda-samples/archive/refs/tags" } } } }
