name: update-nvidia
description: >-
  Update the NVIDIA software stack: driver, CUDA, Fabric Manager, IMEX and NVLSM.
schemaVersion: 1.0

constants:
  - NVIDIA_DRIVER_VERSION:
      type: string
      value: "{{ nvidia_driver_version }}"
  - ARCH:
      type: string
      value: "{{ arch }}"
  - CUDA_VERSION:
      type: string
      value: "{{ cuda_version }}"
  # Driver version NVIDIA bundles with the CUDA release, embedded in the CUDA local-repo installer filename.
  # This is fixed per CUDA version and is generally NOT the driver this component installs (NVIDIA_DRIVER_VERSION);
  # it is only used to build the installer file name.
  - CUDA_RELEASE_NVIDIA_VERSION:
      type: string
      value: "{{ cuda_release_nvidia_version }}"

phases:
  - name: build
    steps:
    - name: InstallDriver
      action: ExecuteBash
      inputs:
        commands:
          - |
            #!/bin/bash
            set -ex

            NVIDIA_DRIVER_VERSION="{{ NVIDIA_DRIVER_VERSION }}"
            ARCH="{{ ARCH }}"
            TMP_DIR="/pcluster-tmp/$(date +"%Y-%m-%dT%H-%M-%S")"

            # Register the driver local repo (kept for the NVLink stack step), then install the driver.
            LOCAL_REPO_PKG="nvidia-driver-local-repo-amzn2023-${NVIDIA_DRIVER_VERSION}"
            LOCAL_REPO_RPM="${LOCAL_REPO_PKG}-1.0-1.${ARCH}.rpm"
            wget -P "${TMP_DIR}" "https://developer.download.nvidia.com/compute/nvidia-driver/${NVIDIA_DRIVER_VERSION}/local_installers/${LOCAL_REPO_RPM}"
            dnf install -y "${TMP_DIR}/${LOCAL_REPO_RPM}"
            dnf clean all

            dnf -y module enable nvidia-driver:open-dkms
            dnf clean all
            dnf install -y nvidia-open nvidia-xconfig xorg-x11-nvidia

            rm -rf "${TMP_DIR}"

    - name: InstallNVLinkStack
      action: ExecuteBash
      inputs:
        commands:
          - |
            #!/bin/bash
            set -ex

            # Fabric Manager, IMEX and libnvsdm must match the driver version exactly; NVLSM is
            # installed at the version bundled in the driver local repo registered by InstallDriver.
            NVIDIA_DRIVER_VERSION="{{ NVIDIA_DRIVER_VERSION }}"
            LOCAL_REPO_PKG="nvidia-driver-local-repo-amzn2023-${NVIDIA_DRIVER_VERSION}"

            # Clear stale version locks so the new versions are not filtered out of the transaction.
            dnf versionlock delete nvidia-fabricmanager nvidia-imex libnvsdm nvlsm || true

            # --best is required on Amazon Linux 2023 (dnf.conf ships best=False).
            dnf install -y --best \
              "nvidia-fabricmanager-${NVIDIA_DRIVER_VERSION}-1*" \
              "nvidia-imex-${NVIDIA_DRIVER_VERSION}-1*" \
              "libnvsdm-${NVIDIA_DRIVER_VERSION}-1*" \
              nvlsm \
              infiniband-diags libibumad

            dnf versionlock add nvidia-fabricmanager nvidia-imex libnvsdm nvlsm
            dnf remove -y "${LOCAL_REPO_PKG}"

    - name: InstallCuda
      action: ExecuteBash
      inputs:
        commands:
          - |
            #!/bin/bash
            set -ex

            CUDA_VERSION="{{ CUDA_VERSION }}"
            CUDA_RELEASE_NVIDIA_VERSION="{{ CUDA_RELEASE_NVIDIA_VERSION }}"
            ARCH="{{ ARCH }}"
            TMP_DIR="/pcluster-tmp/$(date +"%Y-%m-%dT%H-%M-%S")"

            # CUDA major-minor, e.g. 13.2.2 -> "13.2"; repos/packages use the dashed form "13-2".
            CUDA_MAJOR_MINOR="$(echo "${CUDA_VERSION}" | cut -d. -f1-2)"
            CUDA_MAJOR_MINOR_DASH="${CUDA_MAJOR_MINOR//./-}"
            CUDA_REPO_PKG="cuda-repo-amzn2023-${CUDA_MAJOR_MINOR_DASH}-local"
            CUDA_REPO_RPM="${CUDA_REPO_PKG}-${CUDA_VERSION}_${CUDA_RELEASE_NVIDIA_VERSION}-1.${ARCH}.rpm"
            wget -P "${TMP_DIR}" "https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}/local_installers/${CUDA_REPO_RPM}"
            dnf install -y "${TMP_DIR}/${CUDA_REPO_RPM}"
            dnf clean all

            dnf install -y "cuda-toolkit-${CUDA_MAJOR_MINOR_DASH}"
            dnf remove -y "${CUDA_REPO_PKG}"

            # CUDA samples are not in the local repo; they are tagged by CUDA major-minor.
            CUDA_SAMPLES_ARCHIVE="v${CUDA_MAJOR_MINOR}.tar.gz"
            wget -P "${TMP_DIR}" "https://github.com/NVIDIA/cuda-samples/archive/refs/tags/v${CUDA_MAJOR_MINOR}.tar.gz"
            tar xf "${TMP_DIR}/${CUDA_SAMPLES_ARCHIVE}" --directory "/usr/local/"

            rm -rf "${TMP_DIR}"

            CUDA_PATH="/usr/local/cuda"
            echo "export PATH=${CUDA_PATH}/bin:\${PATH}" > /etc/profile.d/pcluster_cuda.sh
            echo "export LD_LIBRARY_PATH=${CUDA_PATH}/lib64:\${LD_LIBRARY_PATH}" >> /etc/profile.d/pcluster_cuda.sh
            chmod +x /etc/profile.d/pcluster_cuda.sh

    - name: Validation
      action: ExecuteBash
      inputs:
        commands:
          - |
            #!/bin/bash
            set -ex

            NVIDIA_DRIVER_VERSION="{{ NVIDIA_DRIVER_VERSION }}"

            source /etc/profile.d/pcluster_cuda.sh
            ls -l /usr/local
            which nvcc
            nvcc --version
            which nvidia-smi
            nvidia-smi

            # Fabric Manager, IMEX and libnvsdm must match the driver version exactly.
            for pkg in nvidia-fabricmanager nvidia-imex libnvsdm; do
              installed="$(rpm -q --qf '%{VERSION}' "${pkg}")"
              echo "${pkg} version: ${installed} (driver: ${NVIDIA_DRIVER_VERSION})"
              if [ "${installed}" != "${NVIDIA_DRIVER_VERSION}" ]; then
                echo "ERROR: ${pkg} ${installed} does not match driver ${NVIDIA_DRIVER_VERSION}" >&2
                exit 1
              fi
            done

            ## NVLSM is versioned independently of the driver.
            rpm -q nvlsm
