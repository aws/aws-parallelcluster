Build:
  InstanceType: {{ build_instance_type }}
  ParentImage: {{ parent_image }}
  SubnetId: {{ public_subnet_id }}
  SecurityGroupIds:
    - {{ default_vpc_security_group_id }}
  Installation:
    NvidiaSoftware:
      Enabled: false
  Components:
    - Type: arn
      Value: {{ component_arn }}
