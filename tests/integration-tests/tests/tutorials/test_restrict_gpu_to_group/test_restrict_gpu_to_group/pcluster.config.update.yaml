Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Dcv:
    Enabled: true
  CustomActions:
    OnNodeUpdated:
      Script: s3://{{ bucket_name }}/gpu-group-gate.sh
      Args:
        - "{{ gpu_group_gid }}"
        - {{ gpu_group_name }}
        - {{ head_node_gpu_users }}
  Iam:
    S3Access:
      - BucketName: {{ bucket_name }}
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    QueueUpdateStrategy: DRAIN
  SlurmQueues:
    - Name: {{ gated_queue }}
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      ComputeResources:
        - Name: {{ compute_resource_name }}
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 1
      HealthChecks:
        Gpu:
          Enabled: true
      CustomActions:
        OnNodeConfigured:
          Script: s3://{{ bucket_name }}/gpu-group-gate.sh
          Args:
            - "{{ gpu_group_gid }}"
            - {{ gpu_group_name }}
      Iam:
        S3Access:
          - BucketName: {{ bucket_name }}
    - Name: {{ ungated_queue }}
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      ComputeResources:
        - Name: {{ compute_resource_name }}
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 1
      HealthChecks:
        Gpu:
          Enabled: true
