Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
  Iam:
    S3Access:
      - BucketName: {{ resource_bucket }}
        EnableWriteAccess: true
  CustomActions:
    OnNodeStart:
      Script: s3://{{ resource_bucket }}/scripts/pre_install.sh
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
  - Name: queue-0
    ComputeResources:
      - Name: compute-resource-0
        Instances:
          - InstanceType: {{ instance }}
    Networking:
      SubnetIds:
        - {{ private_subnet_id }}
