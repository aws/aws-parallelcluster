Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_ids[0] }}
    {% if assign_additional_security_groups == False %}
    SecurityGroups:
      - {{ default_security_group_id }}
    {% else %}
    AdditionalSecurityGroups:
      - {{ default_security_group_id }}
    {% endif %}
  Ssh:
    KeyName: {{ key_name }}
    AllowedIps: {{ ssh_from }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 1
      Networking:
        SubnetIds:
          - {{ private_subnet_ids[1] }}
        AdditionalSecurityGroups:
          - {{ default_security_group_id }}
