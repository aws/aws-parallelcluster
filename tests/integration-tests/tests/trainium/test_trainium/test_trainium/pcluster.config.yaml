Image:
  Os: {{ os }}
HeadNode:
  InstanceType: c5.large
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    S3Access:
      - BucketName: {{ bucket_name }}
      # Needed to download neff file --> FIXME to be removed once we create our own neff files
      - BucketName: aws-parallelcluster-beta
Scheduling:
  Scheduler: slurm
  SlurmQueues:
    - Name: queue-trn32
      ComputeResources:
        - Name: compute-resource-trn32
          Instances:
            - InstanceType: {{instance}}
          MinCount: 2
          Efa:
            Enabled: true
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
        PlacementGroup:
          Name: {{ capacity_reservation_framework_placement_group }}
      CustomActions:
        OnNodeConfigured:
          Script: s3://{{ bucket_name }}/neuron-installation.sh
      Iam:
        S3Access:
          # Needed to download post install script
          - BucketName: {{ bucket_name }}
          # Needed to download neff file --> FIXME to be removed once we create our own neff files
          - BucketName: aws-parallelcluster-beta
    - Name: queue-trn2
      ComputeResources:
        - Name: compute-resource-trn2
          Instances:
            - InstanceType: trn1.2xlarge
          MinCount: 0  # TODO change to 1 once allreduce test is passing
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      CustomActions:
        OnNodeConfigured:
          Script: s3://{{ bucket_name }}/neuron-installation.sh
      Iam:
        S3Access:
          # Needed to download post install script
          - BucketName: {{ bucket_name }}
          # Needed to download neff file --> FIXME to be removed once we create our own neff files
          - BucketName: aws-parallelcluster-beta
