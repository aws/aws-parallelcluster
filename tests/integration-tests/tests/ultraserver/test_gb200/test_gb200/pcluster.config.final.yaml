Image:
  Os: {{ os }}
HeadNode:
  InstanceType: m6g.xlarge
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  CustomActions:
    OnNodeStart:
      Script: s3://{{ bucket_name }}/{{ head_node_start_script }}
  Iam:
    S3Access:
      - BucketName: {{ bucket_name }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
  - Name: {{ queue_with_imex }}
    {% if capacity_block_reservation_id %}
    CapacityType: CAPACITY_BLOCK
    CapacityReservationTarget:
      CapacityReservationId: {{ capacity_block_reservation_id }}
    {% endif %}
    ComputeResources:
      - Name: {{ compute_resource_with_imex }}
        InstanceType: {{ instance }}
        {% if instance == "p6e-gb200.36xlarge" %}
        DisableSimultaneousMultithreading: true
        Efa:
          Enabled: true
          GdrSupport: true
        {% endif %}
        MinCount: {{ max_queue_size }}
        MaxCount: {{ max_queue_size }}
        HealthChecks:
          Gpu:
            Enabled: True
    Networking:
      SubnetIds:
        - {{ private_subnet_id }}
  - Name: {{ queue_without_imex }}
    ComputeResources:
      - Name: {{ compute_resource_without_imex }}
        Instances:
          - InstanceType: m6g.xlarge
          - InstanceType: t4g.xlarge
          - InstanceType: c6gn.xlarge
        MinCount: {{ max_queue_size_without_imex }}
        MaxCount: 1
    Networking:
      SubnetIds:
        - {{ private_subnet_id }}

# The DevSetting below forces the configuration of NVIDIA IMEX but removes topology plugin configuration.
# We do it to test that topology plugin is completely disabled when force_configuration is removed.
{% if instance != "p6e-gb200.36xlarge" %}
DevSettings:
  Cookbook:
    ExtraChefAttributes: |
      { "cluster": { "nvidia": { "imex": { "force_configuration": "true" } } } }
{% endif %}
