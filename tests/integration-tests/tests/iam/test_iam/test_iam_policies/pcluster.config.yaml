Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    AdditionalIamPolicies:
      {% for policy in iam_policies %}
      - Policy: {{ policy }} # Todo: change it to arn instead of name
      {% endfor %}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      Iam:
        AdditionalIamPolicies:
          {% for policy in iam_policies %}
          - Policy: {{ policy }} # Todo: change it to arn instead of name
          {% endfor %}
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
