Image:
  Os: {{ os }}
Iam:
  Roles:
    LambdaFunctionsRole: {{ iam_lambda_role }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    InstanceRole: {{ head_instance_role }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      Iam:
        InstanceProfile: {{ compute_instance_profile }}
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: {{ min_count }}
          Efa:
            Enabled: false
            GdrSupport: false
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
    - Name: queue-1
      Iam:
        InstanceRole: {{ compute_instance_role }}
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: {{ min_count }}
          Efa:
            Enabled: false
            GdrSupport: false
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
