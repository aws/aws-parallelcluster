Image:
  Os: {{ os }}
LoginNodes:
  Pools:
    - Name: login-node-pool-0
      InstanceType: {{ instance }}
      Count: 2
      Networking:
        SubnetIds:
          - {{ public_subnet_id }}
      GracetimePeriod: 5
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    InstanceRole: {{ ec2_iam_role }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            {% for instance_type in flexible_instance_types %}
            - InstanceType: {{ instance_type }}
            {% endfor %}
          MinCount: 1
      Networking:
        SubnetIds:
          - {{ private_subnet_ids[0] }}
      Iam:
        InstanceRole: {{ ec2_iam_role }}
    - Name: queue-1
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            {% for instance_type in flexible_instance_types %}
            - InstanceType: {{ instance_type }}
            {% endfor %}
          MinCount: 1
          MaxCount: 1
      Networking:
        SubnetIds:
          - {{ private_subnet_ids[1] }}
SharedStorage:
  - MountDir: {{ mount_dir }}
    StorageType: Ebs
    Name: ebs
    EbsSettings:
      Iops: 210
      VolumeType: io1
      Encrypted: true
      KmsKeyId: {{ ebs_kms_key_id }}
