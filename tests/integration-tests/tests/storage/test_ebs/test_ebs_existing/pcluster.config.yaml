Image:
  Os: {{ os }}
LoginNodes:
  Pools:
    - Name: login-node-pool-0
      InstanceType: {{ instance }}
      Count: 2
      Networking:
        SubnetIds:
          - {{ public_subnet_id }}
      GracetimePeriod: 3
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
      Networking:
        SubnetIds:
          - {{ private_subnet_ids[0] }}
    - Name: queue-1
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 1
      Networking:
        SubnetIds:
          - {{ private_subnet_ids[1] }}
SharedStorage:
  - MountDir: {{ existing_mount_dir }}
    Name: name1
    StorageType: Ebs
    EbsSettings:
      VolumeType: gp2
      VolumeId: {{ volume_id }}
