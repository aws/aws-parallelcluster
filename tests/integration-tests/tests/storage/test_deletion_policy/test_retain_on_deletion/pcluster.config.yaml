Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  LocalStorage:
    RootVolume:
      DeleteOnTermination: false
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
SharedStorage:
  - MountDir: /ebs1
    Name: {{ ebs_name }}
    StorageType: Ebs
    EbsSettings:
      DeletionPolicy: Retain
  - MountDir: /ebs2
    Name: ebs1
    StorageType: Ebs
    EbsSettings:
      DeletionPolicy: Snapshot

