Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  SharedStorageType: Efs
  Networking:
    SubnetId: {{ head_node_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: slurm
  SlurmSettings:
    QueueUpdateStrategy: TERMINATE
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 1
      Networking:
        SubnetIds:
          - {{ compute_subnet_id }}
SharedStorage:
  - MountDir: {{ mount_dir }}
    Name: efs
    StorageType: Efs
