Image:
  Os: {{ os }}
HeadNode:
  CustomActions:
    OnNodeStart:
      Script: s3://{{ bucket_name }}/scripts/pre_install.sh
      Args:
        - "R curl wget"
        - arg2
        - 'arg3 arg3'
    OnNodeConfigured:
      Script: s3://{{ bucket_name }}/scripts/post_install.sh
      Args:
        - "R curl wget"
        - arg2
        - 'arg3 arg3'
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    S3Access:
      - BucketName: {{ bucket_name }}
  Imds:
    Secured: {{ imds_secured }}
  {% if dcv_enabled %}
  Dcv:
    Enabled: True
  {% endif %}
LoginNodes:
  Pools:
    - Name: pool
      InstanceType: {{ instance }}
      Count: 3
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      CustomActions:
        OnNodeStart:
          Script: s3://{{ bucket_name }}/scripts/pre_install.sh
          Args:
            - "R curl wget"
            - arg2
            - 'arg3 arg3'
        OnNodeConfigured:
          Script: s3://{{ bucket_name }}/scripts/post_install.sh
          Args:
            - "R curl wget"
            - arg2
            - 'arg3 arg3'
      Iam:
        AdditionalIamPolicies:
          - Policy: "arn:{{ partition }}:iam::aws:policy/AmazonS3ReadOnlyAccess"
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    # queue with different quotes for custom bootstrap script
    - Name: bootstrap-scripts-args
      CustomActions:
        OnNodeStart:
          Script: s3://{{ bucket_name }}/scripts/pre_install.sh
          Args:
            - "R curl wget"
            - arg2
            - 'arg3 arg3'
        OnNodeConfigured:
          Script: s3://{{ bucket_name }}/scripts/post_install.sh
          Args:
            - "R curl wget"
            - arg2
            - 'arg3 arg3'
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 0
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      Iam:
        S3Access:
          - BucketName: {{ bucket_name }}
    # queue with a failing post install script
    - Name: broken-post-install
      CustomActions:
        OnNodeConfigured:
          Script: s3://{{ bucket_name }}/failing_post_install.sh
          Args:
            - "no args"
      ComputeResources:
        - Name: compute-i1
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 0
          MaxCount: 2
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      Iam:
        S3Access:
          - BucketName: {{ bucket_name }}
            EnableWriteAccess: False
    - Name: rotation
      ComputeResources:
        - Name: compute-i1
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
    - Name: ht-disabled
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      ComputeResources:
        - Name: compute-i1
          DisableSimultaneousMultithreading: true
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: {{ max_queue_size }}
    - Name: gpu
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      ComputeResources:
        - Name: cr1
          Instances:
            {% for instance_type in flexible_gpu_instance_types %}
            - InstanceType: {{ instance_type }}
            {% endfor %}
          MinCount: 0
          MaxCount: 1
  SlurmSettings:
    ScaledownIdletime: {{ scaledown_idletime }} # Use shorter scaledown time to test logs in slurm_suspend
Monitoring:
  Logs:
    CloudWatch:
      Enabled: true
      RetentionInDays: 14
    Rotation:
      Enabled: true
SharedStorage:
  - MountDir: /shared
    Name: name1
    StorageType: Ebs
DevSettings:
  Cookbook:
    ExtraChefAttributes: '{"cluster": {"tmp_noexec": "true"}}'