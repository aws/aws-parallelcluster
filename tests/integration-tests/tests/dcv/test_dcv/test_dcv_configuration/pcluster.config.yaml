Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Dcv:
    Enabled: true
    Port: {{ dcv_port }}
    AllowedIps: {{ access_from }}
  Imds:
    Secured: {{ imds_secured }}
LoginNodes:
  Pools:
    - Name: pool
      InstanceType: {{ instance }}
      Count: 1
      Networking:
        SubnetIds:
          - {{ public_subnet_id }}
      Dcv:
        Enabled: true
        Port: {{ dcv_port }}
        AllowedIps: {{ access_from }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 1
      Networking:
        SubnetIds:
          - {{ public_subnet_id }}
