Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  LocalStorage:
    RootVolume:
      Size: 80
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      AllocationStrategy: capacity-optimized
      CapacityType: SPOT
      ComputeSettings:
        LocalStorage:
          RootVolume:
            Size: 80
      ComputeResources:
        - Name: compute-resource-0
          Instances:
            - InstanceType: c5.18xlarge
            - InstanceType: c5n.18xlarge
            - InstanceType: c5n.metal
          MinCount: 2
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
SharedStorage:
  - MountDir: /shared
    Name: large
    StorageType: Ebs
    EbsSettings:
      Size: 200
AdditionalPackages:
  IntelSoftware:
    IntelHpcPlatform: true
