Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
    AdditionalSecurityGroups:
      - {{ accounting_client_security_group }}
      - {{ ssh_client_security_group }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
  Iam:
    S3Access:
      - BucketName: "aws-parallelcluster-dev-build-dependencies"
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmSettings:
    MungeKeySecretArn: {{ munge_key_secret_arn }}
    ExternalSlurmdbd:
      Host: {{ slurmdbd_private_ip }}
      Port: {{ slurmdbd_port }}
  SlurmQueues:
    - Name: compute
      ComputeResources:
        - Name: cit
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 0
          MaxCount: 10
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
