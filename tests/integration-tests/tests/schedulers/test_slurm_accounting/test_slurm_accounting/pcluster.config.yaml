Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:{{partition}}:iam::aws:policy/AmazonSSMManagedInstanceCore
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: compute
      ComputeResources:
        - Name: cit
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 0
          MaxCount: 10
      Networking:
        SubnetIds:
          {% for private_subnet_id in private_subnet_ids %}
          - {{ private_subnet_id }}
          {% endfor %}
      Iam:
        AdditionalIamPolicies:
          - Policy: arn:{{partition}}:iam::aws:policy/AmazonSSMManagedInstanceCore
Monitoring:
  Logs:
    CloudWatch:
      Enabled: true
      RetentionInDays: 14
