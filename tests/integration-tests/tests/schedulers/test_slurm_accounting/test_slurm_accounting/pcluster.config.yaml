Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:{{partition}}:iam::aws:policy/AmazonSSMManagedInstanceCore
    S3Access:
      - BucketName: "aws-parallelcluster-dev-build-dependencies"
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: compute
      ComputeResources:
        - Name: cit
          Instances:
            - InstanceType: c5.xlarge
            - InstanceType: m5.xlarge
            - InstanceType: c5d.xlarge
            - InstanceType: t3.xlarge
          MinCount: 0
          MaxCount: 10
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      Iam:
        AdditionalIamPolicies:
          - Policy: arn:{{partition}}:iam::aws:policy/AmazonSSMManagedInstanceCore
Monitoring:
  Logs:
    CloudWatch:
      Enabled: true
      RetentionInDays: 14
